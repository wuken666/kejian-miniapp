<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="课见小程序图标设计方案">
  <rect width="1200" height="560" fill="#ECEDE9"/>

  <g font-family="Microsoft YaHei UI, Microsoft YaHei, PingFang SC, sans-serif" fill="#17201C">
    <text x="64" y="66" font-size="28" font-weight="700">课见 · 图标方向</text>
    <text x="64" y="100" font-size="16" fill="#68716C">先看符号本身，再看配色；右下角为真实小尺寸预览</text>
  </g>

  <g transform="translate(64 138)">
    <rect width="320" height="360" rx="24" fill="#FFFFFF"/>
    <rect x="48" y="34" width="224" height="224" rx="49" fill="#F7F4EE"/>
    <text
      x="160"
      y="182"
      fill="#0E211B"
      font-family="Microsoft YaHei UI, Microsoft YaHei, PingFang SC, sans-serif"
      font-size="116"
      font-weight="700"
      text-anchor="middle"
    >见</text>
    <text x="32" y="300" font-family="Microsoft YaHei UI, sans-serif" font-size="20" font-weight="700" fill="#17201C">A · 单字标</text>
    <text x="32" y="328" font-family="Microsoft YaHei UI, sans-serif" font-size="14" fill="#68716C">最直接，中文识别度最高</text>
    <g transform="translate(252 286) scale(.25)">
      <rect width="128" height="128" rx="28" fill="#F7F4EE"/>
      <text x="64" y="86" fill="#0E211B" font-family="Microsoft YaHei UI, sans-serif" font-size="66" font-weight="700" text-anchor="middle">见</text>
    </g>
  </g>

  <g transform="translate(440 138)">
    <rect width="320" height="360" rx="24" fill="#FFFFFF"/>
    <rect x="48" y="34" width="224" height="224" rx="49" fill="#123D34"/>
    <g transform="translate(48 34) scale(.875)" fill="none" stroke="#F7F4EE" stroke-linecap="round" stroke-linejoin="round" stroke-width="20">
      <path d="M76 68h104v78H76z"/>
      <path d="M96 106h64"/>
      <path d="M116 146v18c0 20-14 30-36 30"/>
      <path d="M142 146v24c0 16 12 24 34 24"/>
    </g>
    <text x="32" y="300" font-family="Microsoft YaHei UI, sans-serif" font-size="20" font-weight="700" fill="#17201C">B · 几何见字</text>
    <text x="32" y="328" font-family="Microsoft YaHei UI, sans-serif" font-size="14" fill="#68716C">更独特，可继续精修为注册图形</text>
    <g transform="translate(252 286) scale(.125)" fill="none" stroke="#F7F4EE" stroke-linecap="round" stroke-linejoin="round" stroke-width="20">
      <rect width="256" height="256" rx="56" fill="#123D34" stroke="none"/>
      <path d="M76 68h104v78H76z"/>
      <path d="M96 106h64"/>
      <path d="M116 146v18c0 20-14 30-36 30"/>
      <path d="M142 146v24c0 16 12 24 34 24"/>
    </g>
  </g>

  <g transform="translate(816 138)">
    <rect width="320" height="360" rx="24" fill="#FFFFFF"/>
    <rect x="48" y="34" width="224" height="224" rx="49" fill="#171A18"/>
    <g transform="translate(48 34) scale(.875)" fill="none" stroke="#F7F4EE" stroke-linecap="round" stroke-linejoin="round" stroke-width="22">
      <path d="M68 64v128"/>
      <path d="M80 128l56-54"/>
      <path d="M80 128l50 50"/>
