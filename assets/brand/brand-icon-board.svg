    <text x="32" y="300" font-family="Microsoft YaHei UI, sans-serif" font-size="20" font-weight="700" fill="#17201C">C · KJ 字母标</text>
    <text x="32" y="328" font-family="Microsoft YaHei UI, sans-serif" font-size="14" fill="#68716C">更像国际软件品牌，但中文关联较弱</text>
    <g transform="translate(252 286) scale(.125)" fill="none" stroke="#F7F4EE" stroke-linecap="round" stroke-linejoin="round" stroke-width="22">
      <rect width="256" height="256" rx="56" fill="#171A18" stroke="none"/>
      <path d="M68 64v128"/>
      <path d="M80 128l56-54"/>
      <path d="M80 128l50 50"/>
      <path d="M170 64v92c0 24-12 36-36 36"/>
