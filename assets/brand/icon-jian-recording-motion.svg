<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="课见录音状态动态图标">
  <style>
    .wave {
      animation-direction: alternate;
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(.77, 0, .175, 1);
      transform-box: fill-box;
      transform-origin: center;
    }

    .wave-left {
      animation-duration: 680ms;
      animation-name: wave-left;
    }

    .wave-center {
      animation-delay: -180ms;
      animation-duration: 520ms;
      animation-name: wave-center;
    }

    .wave-right {
      animation-delay: -320ms;
      animation-duration: 740ms;
      animation-name: wave-right;
    }

    @keyframes wave-left {
      from { transform: scaleY(.65); }
      to { transform: scaleY(1.35); }
    }

    @keyframes wave-center {
      from { transform: scaleY(.72); }
      to { transform: scaleY(1.18); }
    }

    @keyframes wave-right {
      from { transform: scaleY(.72); }
      to { transform: scaleY(1.42); }
    }

    @media (prefers-reduced-motion: reduce) {
      .wave {
        animation: none;
      }
    }
  </style>

  <rect width="256" height="256" rx="56" fill="#103B32"/>
  <g fill="none" stroke="#F5F3EC" stroke-linecap="round" stroke-linejoin="round" stroke-width="20">
    <path d="M76 68h104v78H76z"/>
    <path d="M116 146v18c0 20-14 30-36 30"/>
    <path d="M142 146v24c0 16 12 24 34 24"/>
  </g>
  <g fill="#7BC3A5">
    <rect class="wave wave-left" x="104" y="101" width="8" height="10" rx="4"/>
    <rect class="wave wave-center" x="124" y="95" width="8" height="22" rx="4" fill="#B8E8D4"/>
    <rect class="wave wave-right" x="144" y="101" width="8" height="10" rx="4"/>
  </g>
</svg>
