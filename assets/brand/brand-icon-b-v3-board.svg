        <rect x="104" y="102" width="8" height="8" rx="4"/>
        <rect x="124" y="99" width="8" height="14" rx="4" fill="#B8E8D4"/>
        <rect x="144" y="102" width="8" height="8" rx="4"/>
      </g>
      <text x="0" y="166" font-size="15" font-weight="700" fill="#17201C">等待录音</text>
      <text x="0" y="190" font-size="13" fill="#68716C">音频柱保持安静</text>
    </g>

    <g transform="translate(176 100)">
      <rect width="136" height="136" rx="30" fill="#103B32"/>
      <g transform="scale(.53125)" fill="none" stroke="#F5F3EC" stroke-linecap="round" stroke-linejoin="round" stroke-width="20">
        <path d="M76 68h104v78H76z"/>
        <path d="M116 146v18c0 20-14 30-36 30"/>
        <path d="M142 146v24c0 16 12 24 34 24"/>
      </g>
