<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="课见 B3 录音图标方案">
  <rect width="1200" height="600" fill="#ECEDE9"/>

  <g font-family="Microsoft YaHei UI, Microsoft YaHei, PingFang SC, sans-serif" fill="#17201C">
    <text x="64" y="66" font-size="28" font-weight="700">课见 · B3</text>
    <text x="64" y="100" font-size="16" fill="#68716C">录音是主业务，AI 是状态变化</text>
  </g>

  <g transform="translate(64 140)">
    <rect width="320" height="320" rx="70" fill="#103B32"/>
    <g transform="translate(32 32)" fill="none" stroke="#F5F3EC" stroke-linecap="round" stroke-linejoin="round" stroke-width="20">
      <path d="M76 68h104v78H76z"/>
      <path d="M116 146v18c0 20-14 30-36 30"/>
      <path d="M142 146v24c0 16 12 24 34 24"/>
    </g>
    <g transform="translate(32 32)" fill="#7BC3A5">
      <rect x="104" y="101" width="8" height="10" rx="4"/>
      <rect x="124" y="95" width="8" height="22" rx="4" fill="#B8E8D4"/>
      <rect x="144" y="101" width="8" height="10" rx="4"/>
    </g>
  </g>

  <g transform="translate(440 140)" font-family="Microsoft YaHei UI, Microsoft YaHei, PingFang SC, sans-serif">
