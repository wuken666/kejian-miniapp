        </g>
        <text x="16" y="52" text-anchor="middle" font-size="12" fill="#68716C">32</text>
      </g>
      <g transform="translate(130 -8)">
        <rect width="48" height="48" rx="11" fill="#103B32"/>
        <g transform="scale(.1875)" fill="none" stroke="#F5F3EC" stroke-linecap="round" stroke-linejoin="round" stroke-width="20">
          <path d="M76 68h104v78H76z"/>
          <path d="M116 146v18c0 20-14 30-36 30"/>
          <path d="M142 146v24c0 16 12 24 34 24"/>
        </g>
        <g transform="scale(.1875)" fill="#7BC3A5">
          <rect x="104" y="101" width="8" height="10" rx="4"/>
          <rect x="124" y="95" width="8" height="22" rx="4" fill="#B8E8D4"/>
          <rect x="144" y="101" width="8" height="10" rx="4"/>
        </g>
        <text x="24" y="68" text-anchor="middle" font-size="12" fill="#68716C">48</text>
      </g>
      <g transform="translate(206 -16)">
        <rect width="64" height="64" rx="14" fill="#103B32"/>
        <g transform="scale(.25)" fill="none" stroke="#F5F3EC" stroke-linecap="round" stroke-linejoin="round" stroke-width="20">
          <path d="M76 68h104v78H76z"/>
          <path d="M116 146v18c0 20-14 30-36 30"/>
          <path d="M142 146v24c0 16 12 24 34 24"/>
        </g>
        <g transform="scale(.25)" fill="#7BC3A5">
          <rect x="104" y="101" width="8" height="10" rx="4"/>
          <rect x="124" y="95" width="8" height="22" rx="4" fill="#B8E8D4"/>
          <rect x="144" y="101" width="8" height="10" rx="4"/>
        </g>
        <text x="32" y="84" text-anchor="middle" font-size="12" fill="#68716C">64</text>
      </g>
      <text x="300" y="20" font-size="14" fill="#68716C">录音动画仅在实际录音状态出现</text>
    </g>
